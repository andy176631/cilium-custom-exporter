# cilium-custom-cluster-exporter: one pod for the whole cluster, exporting
# CiliumIdentity counts and label value counts read from the Kubernetes API
# (Cilium 1.13 / 1.14, CRD identity allocation mode).
#
# Everything goes into the cilium namespace, which must already exist. The
# namespace is not created here, so deleting these files never deletes it.
#
# Before applying, replace the image below with the one you built and pushed.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: cilium-custom-cluster-exporter
  namespace: cilium
  labels:
    app.kubernetes.io/name: cilium-custom-cluster-exporter
    app.kubernetes.io/part-of: cilium-custom-exporter
---
# CiliumIdentity is cluster-scoped, so reading it needs a ClusterRole. Read
# only: the exporter never changes identities.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: cilium-custom-cluster-exporter
  labels:
    app.kubernetes.io/name: cilium-custom-cluster-exporter
    app.kubernetes.io/part-of: cilium-custom-exporter
rules:
  - apiGroups: [cilium.io]
    resources: [ciliumidentities]
    verbs: [get, list, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: cilium-custom-cluster-exporter
  labels:
    app.kubernetes.io/name: cilium-custom-cluster-exporter
    app.kubernetes.io/part-of: cilium-custom-exporter
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: cilium-custom-cluster-exporter
subjects:
  - kind: ServiceAccount
    name: cilium-custom-cluster-exporter
    namespace: cilium
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cilium-custom-cluster-exporter
  namespace: cilium
  labels:
    app.kubernetes.io/name: cilium-custom-cluster-exporter
    app.kubernetes.io/part-of: cilium-custom-exporter
spec:
  # One replica is enough: the metrics describe the whole cluster, and a
  # second replica would only make Prometheus store every series twice.
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: cilium-custom-cluster-exporter
  template:
    metadata:
      labels:
        app.kubernetes.io/name: cilium-custom-cluster-exporter
        app.kubernetes.io/part-of: cilium-custom-exporter
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9970"
        prometheus.io/path: /metrics
    spec:
      serviceAccountName: cilium-custom-cluster-exporter
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: exporter
          image: registry.example.com/cilium-custom-cluster-exporter:0.1.0
          imagePullPolicy: IfNotPresent
          args:
            - --listen-address=:9970
            # Identities are watched continuously; every 30s the cache is
            # aggregated and scrapes are served from that result.
            - --collect-interval=30s
          ports:
            - name: metrics
              containerPort: 9970
              protocol: TCP
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          resources:
            requests:
              cpu: 10m
              memory: 64Mi
            limits:
              memory: 256Mi
          livenessProbe:
            httpGet:
              path: /healthz
              port: metrics
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /readyz
              port: metrics
            periodSeconds: 10
