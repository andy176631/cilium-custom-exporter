# Tag-driven image release. The tag prefix picks the exporter:
#
#   node-exporter/v1.2.0     -> cilium-custom-node-exporter
#   cluster-exporter/v1.0.0  -> cilium-custom-cluster-exporter
#
# A matching tag runs test -> build (Kaniko, pushed to every Harbor in
# ci/release-config.yml) -> release. Other pipelines run nothing.
# Settings (runner tags, Harbor list) live in ci/release-config.yml.

include:
  - local: ci/release-config.yml

stages:
  - test
  - build
  - release

workflow:
  rules:
    - if: $CI_COMMIT_TAG =~ /^(node|cluster)-exporter\/v\d+\.\d+\.\d+(-[0-9A-Za-z.]+)?$/

.node-exporter:
  variables:
    COMPONENT: cilium-custom-node-exporter
  rules:
    - if: $CI_COMMIT_TAG =~ /^node-exporter\/v\d+\.\d+\.\d+(-[0-9A-Za-z.]+)?$/

.cluster-exporter:
  variables:
    COMPONENT: cilium-custom-cluster-exporter
  rules:
    - if: $CI_COMMIT_TAG =~ /^cluster-exporter\/v\d+\.\d+\.\d+(-[0-9A-Za-z.]+)?$/

.test:
  extends: .runner
  stage: test
  image: $GO_IMAGE
  script:
    - cd "$COMPONENT"
    - go vet ./...
    # The node exporter's BPF tests skip themselves without CAP_BPF.
    - go test ./...

.build-image:
  extends: .runner
  stage: build
  image:
    name: $KANIKO_IMAGE
    entrypoint: [""]
  script:
    - VERSION="${CI_COMMIT_TAG#*/}"
    - sh ci/harbor.sh auth /kaniko/.docker/config.json
    - |
      if [ -n "${HARBOR_CA_CERT:-}" ]; then
        cat "$HARBOR_CA_CERT" >> /kaniko/ssl/certs/ca-certificates.crt
      fi
    - DESTINATIONS=""
    - |
      for ref in $(sh ci/harbor.sh refs "$COMPONENT" "$VERSION"); do
        echo "push: $ref"
        DESTINATIONS="$DESTINATIONS --destination $ref"
      done
    - >-
      /kaniko/executor
      --context "$CI_PROJECT_DIR/$COMPONENT"
      --dockerfile "$CI_PROJECT_DIR/$COMPONENT/Dockerfile"
      --label "org.opencontainers.image.version=$VERSION"
      --label "org.opencontainers.image.revision=$CI_COMMIT_SHA"
      --label "org.opencontainers.image.source=$CI_PROJECT_URL"
      $DESTINATIONS

# Creates a GitLab Release for the tag, with the component's deploy YAML
# pointed at the new image (from the first Harbor in the list).
.release:
  extends: .runner
  stage: release
  image: $RELEASE_CLI_IMAGE
  script:
    - VERSION="${CI_COMMIT_TAG#*/}"
    - IMAGE="$(sh ci/harbor.sh refs "$COMPONENT" "$VERSION" | head -n 1)"
    - mkdir -p release
    - |
      for f in "$COMPONENT"/deploy/*.yaml; do
        sed "s#image: .*/$COMPONENT:.*#image: $IMAGE#" "$f" > "release/$(basename "$f")"
      done
    - sh ci/harbor.sh refs "$COMPONENT" "$VERSION" > release/images.txt
    - cat release/images.txt
  artifacts:
    paths:
      - release/
    expire_in: never
  release:
    tag_name: $CI_COMMIT_TAG
    name: $CI_COMMIT_TAG
    description: "$COMPONENT $CI_COMMIT_TAG. Images and deploy YAML are in the job artifacts."
    assets:
      links:
        - name: deploy YAML and image list
          url: $CI_PROJECT_URL/-/jobs/$CI_JOB_ID/artifacts/browse/release/

test-node:
  extends: [.test, .node-exporter]

build-node:
  extends: [.build-image, .node-exporter]
  needs: [test-node]

release-node:
  extends: [.release, .node-exporter]
  needs: [build-node]

test-cluster:
  extends: [.test, .cluster-exporter]

build-cluster:
  extends: [.build-image, .cluster-exporter]
  needs: [test-cluster]

release-cluster:
  extends: [.release, .cluster-exporter]
  needs: [build-cluster]
