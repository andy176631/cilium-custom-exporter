# Tag-driven image build and push. The tag prefix picks the exporter and the
# rest of the tag is the image tag:
#
#   node-exporter/v1.2.0     -> cilium-custom-node-exporter:v1.2.0
#   cluster-exporter/v1.0.0  -> cilium-custom-cluster-exporter:v1.0.0
#
# All settings (Harbor list, Dockerfile FROM images, job image) are in
# ci/ci-config.yml. The job does not build anything itself: it copies
# the source to a build server over SSH, which builds the image and pushes it
# to every listed Harbor. The build server must have docker and already
# be logged in to those Harbors. Its address and SSH key come from CI/CD
# variables (see ci/ssh-build.sh).

include:
  - local: ci/ci-config.yml

workflow:
  rules:
    - if: $CI_COMMIT_TAG =~ /^(node|cluster)-exporter\/[A-Za-z0-9_][A-Za-z0-9_.-]{0,127}$/

.build-push:
  image: $CI_JOB_IMAGE
  before_script:
    # The default alpine image has tar but no ssh client.
    - command -v ssh >/dev/null || apk add --no-cache openssh-client
  script:
    - sh ci/ssh-build.sh "$COMPONENT" "${CI_COMMIT_TAG#*/}"

node-exporter:
  extends: .build-push
  variables:
    COMPONENT: cilium-custom-node-exporter
    BASE_IMAGE: $NODE_EXPORTER_BASE_IMAGE
  rules:
    - if: $CI_COMMIT_TAG =~ /^node-exporter\//

cluster-exporter:
  extends: .build-push
  variables:
    COMPONENT: cilium-custom-cluster-exporter
    BASE_IMAGE: $CLUSTER_EXPORTER_BASE_IMAGE
  rules:
    - if: $CI_COMMIT_TAG =~ /^cluster-exporter\//
