# Release settings for .gitlab-ci.yml. This is the file to edit.
#
# Never put passwords or tokens here: this file is committed. Credentials
# live in GitLab CI/CD variables (Settings > CI/CD > Variables, Masked +
# Protected), and this file only names them.

# GitLab runner that runs the release jobs. The jobs only need a Docker or
# Kubernetes executor; Kaniko builds without privileged mode.
# `tags` must match the tags the runner was registered with
# (see ci/runner/config.toml.example).
.runner:
  tags:
    - docker
    # - k8s
    # - cilium-build

variables:
  # Harbor registries the image is pushed to, one per line:
  #
  #   <harbor host>/<project>  <credential variable prefix>
  #
  # For prefix HARBOR_A, define CI/CD variables HARBOR_A_USER and
  # HARBOR_A_PASSWORD (a Harbor robot account is recommended). The image is
  # pushed to every line, e.g.
  #   harbor-a.example.com/cilium/cilium-custom-node-exporter:v1.2.0
  # Lines starting with # are ignored.
  HARBOR_REGISTRIES: |
    harbor-a.example.com/cilium  HARBOR_A
    harbor-b.example.com/cilium  HARBOR_B

  # Also tag a release as `latest` (pre-releases such as v1.2.0-rc.1 never are).
  PUSH_LATEST: "true"

  # Self-signed Harbor: create a CI/CD variable of type "File" named
  # HARBOR_CA_CERT holding the CA certificate (PEM). The build trusts it
  # when it is set; nothing to change here.

  # Images the jobs run in. Use a mirror if the runner cannot reach the
  # internet.
  GO_IMAGE: golang:1.24-bookworm
  KANIKO_IMAGE: gcr.io/kaniko-project/executor:v1.23.2-debug
  RELEASE_CLI_IMAGE: registry.gitlab.com/gitlab-org/release-cli:latest
