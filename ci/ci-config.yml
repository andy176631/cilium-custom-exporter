# CI 的所有設定都在這個檔案：Harbor 位置、Dockerfile 的 FROM image，
# 以及 job 的 container image。
# 密碼和 SSH key 不要寫在這裡，放在 GitLab CI/CD Variables。

variables:
  # Harbor 位置，一行一個：<harbor host>/<project>
  # build server 會把 image 推到每一個位置，例如
  #   harbor-a.example.com/cilium/cilium-custom-node-exporter:v1.2.0
  # 空行和 # 開頭的行會被忽略。build server 要先登入這些 Harbor（docker login）。
  HARBOR_REGISTRIES: |
    harbor-a.example.com/cilium
    harbor-b.example.com/cilium

  # 執行 job 的 container image，需要有 sh、tar 和 ssh。
  # image 沒有 ssh 時，job 會嘗試用 apk 安裝 openssh-client（需要能連到
  # Alpine 套件庫）。runner 連不到外網時，請換成已經裝好 openssh-client 的
  # 內部 image，例如 harbor-a.example.com/library/alpine-ssh:3.20。
  CI_JOB_IMAGE: alpine:3.20

  # Dockerfile 的 FROM image。留空就用 Dockerfile 裡的預設值。
  # BUILDER_IMAGE：編譯用的 Go image（兩個 exporter 共用），
  #   預設 golang:1.24-bookworm
  BUILDER_IMAGE: ""
  # 執行用的 base image，兩個 exporter 分開設定：
  #   node exporter 預設 gcr.io/distroless/static-debian12（以 root 執行）
  #   cluster exporter 預設 gcr.io/distroless/static-debian12:nonroot
  NODE_EXPORTER_BASE_IMAGE: ""
  CLUSTER_EXPORTER_BASE_IMAGE: ""
